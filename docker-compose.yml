services:
  postgres:
    image: postgres:17.6-bookworm
    container_name: pgsql
    restart: always
    environment:
      POSTGRES_USER: postgres              # 超级用户
      POSTGRES_PASSWORD: postgres          # 超级用户密码（生产请改强密码）
      POSTGRES_DB: mydb                    # 初始化默认数据库
      TZ: Asia/Shanghai                    # 时区
      # 仅在首次初始化空 data 目录时生效
      # UTF8 编码、C 排序规则（稳定且可预期）、开启数据校验
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - D:/DockerData/pgsql/data:/var/lib/postgresql/data
      - D:/DockerData/pgsql/init:/docker-entrypoint-initdb.d
    command:
      - postgres                           # 启动主进程
      - -c
      - listen_addresses=*                 # 允许远程访问
      - -c
      - port=5432                          # 监听端口
      - -c
      - shared_buffers=512MB               # 主缓存
      - -c
      - max_connections=200                # 最大连接数
      - -c
      - wal_buffers=16MB                   # WAL 缓冲区
      - -c
      - logging_collector=on               # 启用日志收集
      - -c
      - shared_preload_libraries=pg_stat_statements  # 性能监控扩展
      - -c
      - timezone=Asia/Shanghai             # 时区
      - -c
      - log_min_duration_statement=1000    # 慢 SQL 日志 ≥1 秒
      - -c
      - log_statement=ddl                  # 记录 DDL 语句
    networks:
      pgnet:
        ipv4_address: 172.30.0.10          # 固定 IP

  # 可选：网页管理 pgAdmin（浏览器用）
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@qq.com"   # 登录 pgAdmin 的邮箱
      PGADMIN_DEFAULT_PASSWORD: "zaqxsw123"   # 登录密码
      TZ: Asia/Shanghai                    # 时区
    ports:
      - "5050:80"                          # 浏览器访问端口 http://localhost:5050
    volumes:
      - D:/DockerData/pgsql/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      pgnet:
        ipv4_address: 172.30.0.11          # 固定 IP
      
   
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"     # 仅本机访问：绑到 127.0.0.1（建议如此）。若需局域网访问，改为 "6379:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - "D:/DockerData/redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro"
      - "D:/DockerData/redis/data:/data"
      - "D:/DockerData/redis/logs:/var/log/redis"     # 若用文件日志：映射日志目录（配合 redis.conf 的 logfile 配置）
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "zaqxsw", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "1g"
        reservations:
          cpus: "0.25"
          memory: "256m"
    networks:
      pgnet:
        ipv4_address: 172.30.0.12          # 固定 IP

  # ========================================
  # 【2025-01-XX 新增】Keycloak 认证服务器
  # ========================================
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.1
    container_name: gamehub-keycloak
    restart: always
    # 启动命令：开发模式 + 自动导入 realm
    command:
      - start-dev
      - --import-realm
    environment:
      # === 数据库连接（你现有的 Postgres） ===
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://172.30.0.10:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      # === 管理员账号 ===
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # === HTTP 服务 ===
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      # === 其他配置 ===
      KC_TOKEN_STORE: jpa
      TZ: Asia/Shanghai
      # === Webhook 插件配置 ===
      WEBHOOK_HTTP_BASE_PATH: "http://host.docker.internal:8080/system-service/internal/keycloak/events"
      WEBHOOK_HTTP_EVENTS_INCLUDE: "REGISTER"
      WEBHOOK_HTTP_AUTH_USERNAME: "admin"
      WEBHOOK_HTTP_AUTH_PASSWORD: "123456"
      # === 日志调试级别 ===
      KC_LOG_LEVEL: "info,com.vymalo.keycloak.webhook:debug"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8180:8180"
    volumes:
      # 数据持久化
      - D:/DockerData/Keycloak/data:/opt/keycloak/data
      # Realm 导入目录（放 JSON）
      - D:/DockerData/Keycloak/import:/opt/keycloak/data/import:ro
      # 自定义主题
      - D:/DockerData/Keycloak/themes:/opt/keycloak/themes:ro
      # SPI 扩展（jar）
      - D:/DockerData/Keycloak/providers:/opt/keycloak/providers:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8180/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      pgnet:
        ipv4_address: 172.30.0.13
        
        
  # ========================================
  # MinIO 对象存储服务（带 Web Console）
  # ========================================
  minio:
    image: minio/minio:RELEASE.2023-04-28T18-11-17Z
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # Web 控制台
    volumes:
      - D:/DockerData/minio/data:/data
      - D:/DockerData/minio/config:/root/.minio
    networks:
      pgnet:
        ipv4_address: 172.30.0.14       # 固定 IP（按你当前段落递增）
    
   
  kafka:
      image: apache/kafka:latest
      container_name: kafka

      ports:
        # 宿主机固定 9092（本机 IDE / Java / Kafka-UI 连 localhost:9092）
        # 映射到容器 19092（宿主机专用 listener）
        - "9092:19092"

      volumes:
        # Kafka 数据持久化到 Windows
        - D:/DockerData/kafka/data:/opt/kafka/data

      environment:
        # ===== Kafka 节点 ID（KRaft 模式必须）
        KAFKA_NODE_ID: 1

        # ===== Kafka 进程角色（KRaft 模式，无需 Zookeeper）
        KAFKA_PROCESS_ROLES: broker,controller

        # ===== Kafka 实际监听端口（容器内部）
        # INTERNAL   ：Docker 网络内访问（kafka:9092）
        # EXTERNAL   ：宿主机访问（容器内 19092，宿主机映射到 9092）
        # CONTROLLER ：KRaft 内部通信（不对外）
        KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093

        # ===== Kafka 对外公布的访问地址（最关键）
        # Docker 内部服务 → kafka:9092
        # 宿主机程序     → localhost:9092（实际走到容器 19092）
        KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092

        # ===== listener 名称 → 协议映射
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

        # ===== broker 之间通讯用哪个 listener（必须属于 advertised.listeners 的名字）
        # 你这里的 listener 名是 INTERNAL/EXTERNAL，不是 PLAINTEXT，所以必须显式指定
        KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

        # ===== 指定 controller 使用哪个 listener
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

        # ===== KRaft controller 投票成员列表
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

        # ===== 单机必须为 1 的配置
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

        # ===== consumer group 启动不延迟重平衡
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        # ===== 关闭topic自动创建
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      networks:
        - pgnet

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      # Kafka-UI 页面：http://localhost:8080
      - "9081:8080"
    environment:
      # UI 里显示的集群名称（随便起）
      KAFKA_CLUSTERS_0_NAME: local-kafka

      # Kafka 地址：注意这里必须用容器内地址 kafka:9092（不是 localhost）
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

      # 可选：动态配置（UI里临时加集群/改配置）
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - pgnet
      
      
      
  # 服务名（compose 内部引用用）
  mysql8:
    # 使用官方 MySQL 8.0 镜像
    image: mysql:8.0

    # 固定容器名（方便你 docker ps / logs）
    container_name: mysql8
    # 自动重启策略：除非你手动 stop，否则异常退出会拉起
    restart: unless-stopped
    # 端口映射：宿主机 3306 -> 容器 3306（你说默认端口不变）
    ports:
      # 字符串写法更稳（避免被当成数字解析）
      - "3306:3306"
    # 环境变量（初始化 & 时区）
    environment:
      # root 密码（第一次初始化数据目录时生效）
      MYSQL_ROOT_PASSWORD: zaqxsw
      # 容器内时区（影响时间函数/日志时间）
      TZ: Asia/Shanghai

    # 目录映射（Windows 路径建议用正斜杠）
    volumes:
      # 数据目录（最关键：持久化 MySQL 数据）
      - "D:/DockerData/mysql8/data:/var/lib/mysql"
      # 配置目录（你自己放 .cnf 文件到 D:/DockerData/mysql8/conf）
      - "D:/DockerData/mysql8/conf:/etc/mysql/conf.d"
      # 日志目录（可选：把容器日志落到宿主机）
      - "D:/DockerData/mysql8/logs:/var/log/mysql"
    networks:
      pgnet:
        ipv4_address: 172.30.0.15      # 固定 IP（按你当前段落递增）

    

  # ========================================
  # 【2025-01-XX 新增】Gateway 网关服务
  # ========================================
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gamehub-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Spring Profile（用于区分容器环境和本地环境）
      SPRING_PROFILES_ACTIVE: docker
      # Keycloak 地址（容器内使用固定IP）
      KEYCLOAK_ISSUER_URI: http://172.30.0.13:8180/auth/realms/gamehub
      # Redis 地址（容器内使用固定IP）
      SPRING_DATA_REDIS_HOST: 172.30.0.12
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: zaqxsw
      TZ: Asia/Shanghai
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      pgnet:
        ipv4_address: 172.30.0.99          # 固定 IP
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

 

networks:
  pgnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24            # 独立子网，避免与宿主机冲突
